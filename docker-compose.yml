name: pasti
services:
  # Next.js Application
  pasti_app:
    container_name: pasti_app
    image: pasti_app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
        - NEXT_PUBLIC_STATIC_UUID=${NEXT_PUBLIC_STATIC_UUID:-}
        - NEXT_PUBLIC_QR_BASE_URL=${NEXT_PUBLIC_QR_BASE_URL:-}
        - NEXT_PUBLIC_WA_API_URL=${NEXT_PUBLIC_WA_API_URL:-http://localhost:3001/wa-api}
        - NEXT_PUBLIC_SKD_LINK=${NEXT_PUBLIC_SKD_LINK:-}
      cache_from:
        - type=local,src=.docker-cache
      cache_to:
        - type=local,dest=.docker-cache,mode=max
    ports:
      - "3001:3000"
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      - NEXT_PUBLIC_STATIC_UUID=${NEXT_PUBLIC_STATIC_UUID}
      - NEXT_PUBLIC_QR_BASE_URL=${NEXT_PUBLIC_QR_BASE_URL}
      - NEXT_PUBLIC_WA_API_URL=${NEXT_PUBLIC_WA_API_URL:-http://localhost:3001/wa-api}
      - NEXT_PUBLIC_SKD_LINK=${NEXT_PUBLIC_SKD_LINK:-}
      - WA_ADMIN_KEY=${WA_ADMIN_KEY}
      - REDIS_URL=${REDIS_URL:-redis://pasti_redis:6379}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Makassar}
      - HOSTNAME=0.0.0.0
    depends_on:
      pasti_db:
        condition: service_healthy
      pasti_redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pasti_app.rule=Host(`${TRAEFIK_HOST:-pasti.databenuanta.id}`)"
      - "traefik.http.routers.pasti_app.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.services.pasti_app.loadbalancer.server.port=3000"
      - "traefik.http.routers.pasti_app.tls=${TRAEFIK_TLS:-true}"

  # MySQL Database
  pasti_db:
    container_name: pasti_db
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD not set}
      - MYSQL_DATABASE=${MYSQL_DATABASE:?MYSQL_DATABASE not set}
      - MYSQL_USER=${MYSQL_USER:?MYSQL_USER not set}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD not set}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pasti_mysql_data:/var/lib/mysql
    restart: unless-stopped

  # WhatsApp Bot API (Optional - uncomment to use)
  # wa-bot:
  #   image: ghcr.io/jstfire/bot-wa-pst:latest
  #   # or build from source if you have the repository
  #   # build:
  #   #   context: ../bot-wa-pst
  #   #   dockerfile: Dockerfile
  #   ports:
  #     - "3015:3015"
  #   environment:
  #     - ADMIN_KEY=contoh_admin_key
  #     - PORT=3015
  #   restart: unless-stopped
  #   volumes:
  #     - wa_bot_data:/app/data

  # Redis for rate limiting / caching
  pasti_redis:
    container_name: pasti_redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - pasti_redis_data:/data

  # Cloudflare Tunnel (optional)
  cloudflared:
    container_name: pasti_cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN not set}
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      pasti_app:
        condition: service_started

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  pasti_mysql_data:
    name: pasti_mysql_data
  wa_bot_data:
  pasti_redis_data:
